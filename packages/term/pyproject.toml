[project]
name = "term"
version = "0.1.0"
description = "Terminal UI building blocks for ctx: Textual widgets, block renderers, formatting, and input primitives. Ships the ctx.tui package; the coding-agent app lives in ctx-code."
requires-python = ">=3.12"
keywords = ["tui", "terminal", "textual", "ctx"]
dependencies = [
    "ctx",
    "textual>=8.0.0",
    "rich>=13.0.0",
]

[tool.uv.sources]
ctx = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/ctx"]
sources = ["src"]
