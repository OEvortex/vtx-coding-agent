[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtx"]

[project]
name = "vtx-coding-agent"
version = "2.0.0"
description = "DEPRECATED — use ctx-agent instead. This package installs ctx-agent and provides the `vtx` command as a compatibility wrapper."
requires-python = ">=3.12"
keywords = ["coding-agent", "tui", "cli", "llm", "deprecated"]
license = "Apache-2.0"
authors = [
    { name = "OEvortex" },
]
readme = "README.md"
homepage = "https://github.com/OEvortex/ctx-coding-agent"
repository = "https://github.com/OEvortex/ctx-coding-agent"
dependencies = [
    "ctx-sdk>=0.1.0",
    "ctx-term>=0.1.0",
    "ctx-agent>=0.1.0",
]

[project.scripts]
vtx = "vtx.bridge:main"
