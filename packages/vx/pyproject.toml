[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vx"]

[project]
name = "vx"
version = "0.1.0"
description = "Minimal coding agent built on the ctx harness with its own terminal UI."
license = "Apache-2.0"
authors = [
    { name = "OEvortex" },
]
readme = "README.md"
homepage = "https://github.com/OEvortex/ctx-coding-agent"
repository = "https://github.com/OEvortex/ctx-coding-agent"
requires-python = ">=3.12"
keywords = ["coding-agent", "tui", "cli", "llm"]
dependencies = [
    "ctx-sdk>=0.1.0",
    "ctx-agent>=0.1.0",
]

[project.scripts]
vx = "vx.cli:main"

[tool.uv.sources]
ctx-sdk = { workspace = true }
ctx-agent = { workspace = true }
