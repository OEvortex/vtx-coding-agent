[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vx"]

[project]
name = "vx"
version = "0.1.0"
description = "Minimal coding agent built on the ctx harness with its own terminal UI."
requires-python = ">=3.12"
keywords = ["coding-agent", "tui", "cli", "llm"]
dependencies = [
    "ctx",
    "ctx-code",
]

[project.scripts]
vx = "vx.cli:main"

[tool.uv.sources]
ctx = { workspace = true }
ctx-code = { workspace = true }
