[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx"]
exclude = [
    "src/ctx/term",
    "src/ctx/code",
    "src/ctx/mcp",
    "src/ctx/codemode",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/ctx/term",
    "src/ctx/code",
    "src/ctx/mcp",
    "src/ctx/codemode",
]

[tool.hatch.build]
artifacts = []

[project]
name = "ctx-sdk"
version = "0.1.0"
description = "Minimalist agent harness: agent loop, sessions, tools, plugin composition, MCP client, 65 LLM providers, and a Python SDK. The coding agent CLI/TUI is a separate package (ctx-code) built on top."
requires-python = ">=3.12"
keywords = ["agent", "harness", "llm", "agent-loop", "sdk"]
license = "Apache-2.0"
authors = [
    { name = "OEvortex" },
]
readme = "README.md"
homepage = "https://github.com/OEvortex/ctx-coding-agent"
repository = "https://github.com/OEvortex/ctx-coding-agent"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "chardet>=3.0.2,<6.0.0",
    "curl-cffi>=0.15.0",
    "filelock>=3.25.2",
    "hammett>=0.10.0",
    "html-to-markdown>=3.3.0,<3.4.0",
    "json-repair>=0.57.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "lxml-html-clean>=0.4.3",
    "oauth-cli-kit>=0.1.3,<1.0.0",
    "packaging>=24.0",
    "pillow>=12.1.1",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readability-lxml>=0.8.4",
    "rich>=14.3.2",
    "typer>=0.20.0,<1.0.0",
    "protobuf>=5.29,<7",
]

[project.optional-dependencies]
term = [
    "ctx-term>=0.1.0",
]

gh-app = [
    "cryptography>=41.0",
]

