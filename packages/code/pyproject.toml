[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/ctx"]
sources = ["src"]
exclude = [
    "src/ctx/code/builtin_skills/meta/ctx-self-extend/references/docs",
]

[tool.hatch.build]
artifacts = []

[project]
name = "ctx-agent"
version = "0.1.0"
description = "Coding agent product built on the ctx harness: Textual TUI, headless CLI, session management, and the ctx console script."
requires-python = ">=3.12"
keywords = ["coding-agent", "tui", "cli", "llm"]
license = "Apache-2.0"
authors = [
    { name = "OEvortex" },
]
readme = "README.md"
homepage = "https://github.com/OEvortex/ctx-coding-agent"
repository = "https://github.com/OEvortex/ctx-coding-agent"
dependencies = [
    "ctx-sdk>=0.1.0",
    "ctx-term>=0.1.0",
    "textual>=8.0.0",
]

[project.scripts]
ctx = "ctx.code.cli:main"

