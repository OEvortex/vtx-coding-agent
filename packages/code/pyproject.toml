[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/ctx"]
sources = ["src"]
exclude = [
    "src/ctx/coding_agent/builtin_skills/meta/ctx-self-extend/references/docs",
]

[tool.hatch.build]
artifacts = []

[project]
name = "ctx-code"
version = "0.1.0"
description = "Coding agent product built on the ctx harness: Textual TUI, headless CLI, session management, and the ctx console script."
requires-python = ">=3.12"
keywords = ["coding-agent", "tui", "cli", "llm"]
dependencies = [
    "ctx",
    "term",
    "textual>=8.0.0",
]

[project.scripts]
ctx = "ctx.coding_agent.cli:main"

[tool.uv.sources]
ctx = { workspace = true }
term = { workspace = true }
