[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtx-openjarvis"
version = "1.1.1"
description = "OpenJarvis autonomous agent runtime — channels, gateway, cron, and tools."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["agent", "tui", "gateway", "channels", "automation"]
dependencies = [
    "vtx-coding-agent>=1.1.1",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "httpx>=0.28.0,<1.0.0",
    "pillow>=12.1.1",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "textual>=8.0.0",
]

[project.optional-dependencies]
api = [
    "aiohttp>=3.9.0,<4.0.0",
]
matrix = [
    "matrix-nio[e2e]>=0.25.2; sys_platform != 'win32'",
    "aiohttp>=3.9.0,<4.0.0",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]
discord = [
    "discord.py>=2.5.2,<3.0.0",
]
whatsapp = [
    "neonize>=0.3.18.post0,<0.4.0",
    "segno>=1.6.1,<2.0.0",
]
msteams = [
    "PyJWT>=2.0,<3.0",
    "cryptography>=41.0",
]
weixin = [
    "qrcode[pil]>=8.0",
    "pycryptodome>=3.20.0",
]
wecom = [
    "wecom-aibot-sdk-python>=0.1.5",
]
langsmith = [
    "langsmith>=0.1.0",
]
pdf = [
    "pymupdf>=1.25.0",
]
olostep = [
    "olostep>=0.1.0",
]

[project.scripts]
vtx-jarvis = "vtx.openjarvis.agent.cli:main"
openjarvis = "vtx.openjarvis.agent.cli:main"

[dependency-groups]
dev = [
    "cito>=0.3.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "twine>=5.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vtx/openjarvis"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"src/vtx/openjarvis/tui/latex.py" = ["RUF001"]
"src/vtx/openjarvis/agent/prompts/identity.py" = ["E501"]
"src/vtx/openjarvis/agent/prompts/env.py" = ["E501"]
"src/vtx/openjarvis/agent/sdk/**/*.py" = ["N818"]
"src/vtx/openjarvis/ai/_httpcore_patch.py" = ["N806", "N812", "SIM117", "RUF002", "RUF003", "B009", "E501"]
"src/vtx/openjarvis/tests/ui/test_latex.py" = ["RUF001"]
"src/vtx/openjarvis/tests/sdk/**/*.py" = ["N818", "E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["src/vtx/openjarvis/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
