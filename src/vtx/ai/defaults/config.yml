meta:
  config_version: 15

llm:
  default_provider: "openai-codex"
  default_model: "gpt-5.5"
  default_base_url: ""
  default_thinking_level: "low"
  tool_call_idle_timeout_seconds: 180
  request_timeout_seconds: 600

  auth:
    openai_compat: "auto"
    anthropic_compat: "auto"

  tls:
    insecure_skip_verify: false

  system_prompt:
    git_context: true
    ponytail: false

compaction:
  on_overflow: "continue"
  threshold_percent: 80

# Continual-harness refinement. The harness is the persistent, editable set of
# prompt notes, memories, skills, and subagent specs rendered into the system
# prompt (see the `# Continual Harness State` section). Auto-refine reviews the
# trajectory at a turn boundary and, when it approves, applies small
# evidence-backed edits to that harness. Set `enabled: false` to keep
# refinement strictly manual (`/refine`, or the `refine` tool / kernel skill).
refine:
  enabled: true
  # Review after this many assistant turns.
  turn_interval: 25
  # Also review right after a context compaction.
  on_compact: true
  # Minimum gap between two reviews.
  cooldown_minutes: 20

agent:
  max_turns: 500
  default_context_window: 200000

ui:
  theme: "gruvbox-dark"
  collapse_thinking: true
  show_welcome_shortcuts: true
  hidden_models: []
  model_provider_filter: ""

permissions:
  mode: "prompt"

notifications:
  enabled: false
  volume: 0.5

# Idle session recap: after an agent run finishes and you haven't typed for a
# while (or when you resume a session), vtx drafts a 1-3 sentence "where you
# left off" summary using the current model. Disable to opt out.
recap:
  enabled: true
  idle_seconds: 60

# Extensions: Python files or packages that hook into vtx at startup.
# Each entry is a path to a ``.py`` file or a package directory containing
# ``__init__.py``. Auto-discovered paths (``.vtx/extensions/`` and
# ``~/.vtx/agent/extensions/``) are always loaded unless ``--no-extensions``
# is passed on the CLI; entries below are additive.
#
# Example:
#   extensions:
#     - ~/.vtx/extensions/permission_gate.py
#     - ./tools/vtx-extensions/audit-logger/
extensions: []

# Switchable handoff agents (``.vtx/agent/<name>.py``). Auto-discovered
# paths (``<cwd>/.vtx/agent/`` walked to the git root, and
# ``~/.vtx/agent/``) are always loaded; entries below are additive.
#
# ``default`` is the agent activated at session start when ``--agent`` /
# ``VTX_AGENT`` is not set. Empty string = no agent active.
# ``switch_mode`` controls how Shift+Tab / ``/agent <name>`` behaves.
#
# Example:
#   agents:
#     default: code-review
#     switch_mode: lock
#     files:
#       - ./team_agents/security_audit.py
agents:
  default: ""
  switch_mode: "lock"
  files: []

# Sub-agent dispatch for the ``Task`` tool.
#
# There are no built-in sub-agent presets: a ``subagent_type`` is resolved
# against the agents in ``.vtx/agent/<name>.py`` and an unknown name falls
# back to a bare default sub-agent with the parent's tool surface.
#
# ``max_concurrent`` caps how many sub-agents run at once; the rest wait in a
# FIFO queue (0 = no cap). This keeps a fan-out from hammering one provider
# and gives the TUI an honest running/queued split to display.
task:
  max_concurrent: 4

# Runtime mode for the agent.
# ``tool_first`` uses the default surgical tool surface (read, edit, write,
# bash, find, web, ask_user, task, goal, skill).
# ``rlm`` switches to a REPL-first experience where the model primarily
# executes Python through a persistent ``ipython`` tool, similar to
# Prime Agent's RLM harness.
mode: tool_first

# Example: DeepSeek provider
# export DEEPSEEK_API_KEY="sk-your-api-key"
#
# Then set in [llm]:
# default_provider = "deepseek"
# default_model = "deepseek-v4-flash"
