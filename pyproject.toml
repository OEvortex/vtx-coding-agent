[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
override-dependencies = [
    "aiofiles>=25.1.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
 "cito>=0.3.0",
 "pyright>=1.1.408",
 "pytest>=9.0.2",
 "pytest-asyncio>=1.3.0",
 "pytest-cov>=6.0.0",
 "pytest-xdist>=3.8.0",
 "ruff>=0.15.8",
 "twine>=5.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 99
# Type-check-only views of the shared ctx namespace. The real modules live
# under packages/code/src and packages/term/src and are linted there.
extend-exclude = [
    "packages/ctx/src/ctx/term/",
    "packages/ctx/src/ctx/code/",
    "packages/ctx/src/ctx/mcp/",
    "packages/ctx/src/ctx/codemode/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"packages/term/src/ctx/term/latex.py" = ["RUF001"]
"packages/code/src/ctx/code/prompts/identity.py" = ["E501"]
"packages/ctx/src/ctx/agent/prompts/env.py" = ["E501"]
"packages/ctx/src/ctx/agent/sdk/**/*.py" = ["N818"]
"packages/ctx/src/ctx/ai/_httpcore_patch.py" = ["N806", "N812", "SIM117", "RUF002", "RUF003", "B009", "E501"]
"packages/vx/**" = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

